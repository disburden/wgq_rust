[package]
name = "wgq_rust"
version = "0.1.7"
edition = "2021"
authors = ["disburden <wgq@email.com>"]
repository = "https://github.com/disburden/wgq_rust.git"
description = "我自己用的库,可能不是适合所有人"
categories = ["development-tools"]
license = "MIT"

[dependencies]
openssl = "0.10"
base64 = "0.22"
bcrypt = "0.17"
aes-gcm = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
anyhow = "1.0"
paste = "1.0"
des = "0.8"
ecb = "0.1" # 加上这个依赖
# cipher = { version = "0.4", features = ["block-padding", "alloc"] }
